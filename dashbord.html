<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard – StockPro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside>
      <div class="logo">MR MAO​ SHOP</div>
      <button class="on" onclick="window.location.href='dashbord.html'">Dashboard</button>
      <button onclick="window.location.href='stork.html'">Stock</button>
      <button onclick="window.location.href='Addproduct.html'">Add Product</button>
      <button onclick="window.location.href='Order/success.html'">Order / Success</button>
      <button class="out" onclick="window.location.href='login.html'">Log out</button>
    </aside>
    <main>
      <h2>ការវិភាគបញ្ជាទិញ</h2>
      <div class="cards">
        <div class="card"><small>ផលិតផលសរុប</small><div class="n">5</div></div>
        <div class="card"><small>ផលិតផលក្នុងស្ដុក</small><div class="n">2</div></div>
        <div class="card"><small>តម្លៃស្ដុក</small><div class="n">$9,153</div></div>
        <div class="card"><small>កម្មង់ថ្ងៃនេះ</small><div class="n">56</div></div>
      </div>
      <div class="row">
        <div class="card">
          <h3>ស្ដុកប្រចាំសប្ដាហ៏</h3>
          <div class="bars">
            <div style="height:55%"></div><div style="height:80%"></div><div style="height:42%"></div>
            <div style="height:100%"></div><div style="height:70%"></div><div style="height:100%"></div><div style="height:60%"></div>
          </div>
        </div>
        <div class="card">
          <h3>ការកម្មង់រួចរាល់</h3>
          <div class="alert"><span>USB-C Cable 1m</span><span class="pill low">18</span></div>
          <div class="alert"><span>27in Monitor</span><span class="pill low">9</span></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
